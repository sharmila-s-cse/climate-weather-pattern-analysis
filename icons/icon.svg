<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Ambient circle glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#brandGrad)" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="12 12" opacity="0.4"/>
  <!-- Weather / Climate Wave & Thermal Spark -->
  <path d="M 140 280 C 180 220, 220 340, 260 260 C 300 180, 340 300, 380 230" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="380" cy="230" r="18" fill="#10b981" filter="url(#glow)"/>
  <circle cx="140" cy="280" r="14" fill="#06b6d4"/>
  <!-- Thermometer / Leaf accent -->
  <circle cx="256" cy="160" r="10" fill="#38bdf8"/>
  <circle cx="210" cy="360" r="8" fill="#34d399"/>
</svg>
